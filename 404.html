<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukurasa haupatikani - UPSF</title>
  <meta http-equiv="refresh" content="5;url=/">
  <style>
    :root{--green:#0F5226;--red:#C00000;--bg:#F8F9FA;--text:#333}
    *{box-sizing:border-box}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);line-height:1.6;padding:20px}
    .box{max-width:460px;width:100%;background:#fff;border-radius:12px;box-shadow:0 4px 18px #0000000d;border-top:5px solid var(--green);padding:28px;text-align:center}
    img{width:100px;height:100px;object-fit:contain;border-radius:50%}
    h1{color:var(--green);font-size:1.5rem;margin:12px 0 6px}
    a.btn{display:inline-block;margin-top:14px;background:var(--red);color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;font-weight:bold}
    a.btn:hover{background:#900000}
  </style>
</head>
<body>
  <div class="box">
    <img src="/upsf-logo.jpg" alt="UPSF logo">
    <h1>Ukurasa haupatikani</h1>
    <p>Samahani, ukurasa unaoutafuta haupo. Unarudishwa ukurasa wa mwanzo...</p>
    <p><small>Page not found. Redirecting you to the homepage.</small></p>
    <a class="btn" href="/">Rudi Mwanzo (Home)</a>
  </div>
</body>
</html>
